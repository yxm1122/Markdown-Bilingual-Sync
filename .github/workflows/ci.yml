# CI：在 push / PR 时执行类型检查、全量测试并打包 VSIX 工件。
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: markdown-bilingual-sync-vsix
          path: artifacts/vsix/markdown-bilingual-sync.vsix
